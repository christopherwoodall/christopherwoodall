<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="680" rx="14" fill="#0e1116"/>

  <text x="24" y="38" fill="#e6edf3" font-size="16" font-weight="bold">thingino capture lab — the camera ends up talking to a broker you own</text>
  <text x="24" y="60" fill="#8b98a5" font-size="12">sanitized · no real addresses</text>

  <!-- home uplink box (top right) -->
  <rect x="590" y="24" width="266" height="62" rx="10" fill="#141a22" stroke="#2b3542"/>
  <text x="608" y="48" fill="#e6edf3" font-size="13.5" font-weight="bold">home uplink → internet</text>
  <text x="608" y="68" fill="#8b98a5" font-size="12">the real vendor cloud lives here</text>

  <!-- ================= row of three boxes ================= -->
  <!-- camera -->
  <rect x="20" y="104" width="220" height="170" rx="10" fill="#1a1522" stroke="#f472b6"/>
  <text x="38" y="130" fill="#f472b6" font-size="14" font-weight="bold">camera (pan v3)</text>
  <text x="216" y="128" fill="#f472b6" font-size="11" font-weight="bold">③④⑤</text>
  <text x="38" y="154" fill="#c9d5e0" font-size="12">stock vendor firmware</text>
  <text x="38" y="173" fill="#c9d5e0" font-size="12">thinks it talks to the cloud</text>
  <text x="38" y="192" fill="#c9d5e0" font-size="12">accepts MQTT + OTA cmds</text>
  <text x="38" y="211" fill="#c9d5e0" font-size="12">secure boot via patched SPL</text>
  <text x="38" y="230" fill="#8b98a5" font-size="11.5">steppers on GPIO pins</text>

  <!-- openwrt ap -->
  <rect x="300" y="104" width="230" height="170" rx="10" fill="#132230" stroke="#34d399"/>
  <text x="318" y="130" fill="#34d399" font-size="14" font-weight="bold">openwrt lab AP</text>
  <text x="318" y="154" fill="#c9d5e0" font-size="12">lab SSID for the camera</text>
  <text x="318" y="173" fill="#c9d5e0" font-size="12">dnsmasq: vendor DNS</text>
  <text x="318" y="192" fill="#c9d5e0" font-size="12">  → tool host</text>
  <text x="318" y="211" fill="#c9d5e0" font-size="12">DHCP · NTP server</text>
  <text x="318" y="230" fill="#8b98a5" font-size="11.5">camera clock served here</text>

  <!-- tool host -->
  <rect x="590" y="104" width="266" height="170" rx="10" fill="#10222a" stroke="#22d3ee"/>
  <text x="608" y="130" fill="#22d3ee" font-size="14" font-weight="bold">tool host (laptop)</text>
  <text x="608" y="154" fill="#c9d5e0" font-size="12">fake vendor broker :8883</text>
  <text x="608" y="173" fill="#c9d5e0" font-size="12">payload server :8443</text>
  <text x="608" y="192" fill="#c9d5e0" font-size="12">command center · MJPEG</text>
  <text x="608" y="211" fill="#c9d5e0" font-size="12">verified backup target</text>
  <text x="608" y="230" fill="#8b98a5" font-size="11.5">NAT: lab → home uplink</text>

  <!-- arrows: camera → ap → tool -->
  <line x1="240" y1="180" x2="296" y2="180" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <text x="248" y="170" fill="#22d3ee" font-size="11.5">① join</text>
  <line x1="530" y1="180" x2="586" y2="180" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <text x="536" y="170" fill="#22d3ee" font-size="11.5">② eth</text>
  <line x1="530" y1="204" x2="586" y2="204" stroke="#22d3ee" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="536" y="221" fill="#8b98a5" font-size="11">payloads</text>

  <!-- uplink: tool host → home box -->
  <line x1="723" y1="104" x2="723" y2="88" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrg)"/>
  <text x="735" y="100" fill="#8b98a5" font-size="11">NAT uplink</text>

  <!-- flow box A -->
  <rect x="20" y="316" width="836" height="112" rx="10" fill="#131a24" stroke="#2b3542"/>
  <text x="40" y="344" fill="#e6edf3" font-size="13.5" font-weight="bold">① pair — needs real internet</text>
  <text x="40" y="368" fill="#9fb3c8" font-size="12">the tool host NATs the lab out the home uplink during app pairing</text>
  <text x="40" y="390" fill="#9fb3c8" font-size="12">② provisioned camera keeps its cloud session — DNS sends it to the tool host</text>

  <!-- flow box B -->
  <rect x="20" y="452" width="836" height="124" rx="10" fill="#131a24" stroke="#2b3542"/>
  <text x="40" y="480" fill="#e6edf3" font-size="13.5" font-weight="bold">③④⑤ then the flash</text>
  <text x="40" y="504" fill="#9fb3c8" font-size="12">③ MQTT command → camera pulls a RAM-only diagnostic (exposes flash)</text>
  <text x="40" y="526" fill="#9fb3c8" font-size="12">④ verified backup: every partition, read twice, byte-compared</text>
  <text x="40" y="548" fill="#9fb3c8" font-size="12">⑤ thingino image written partition-by-partition, boot last → reboot</text>

  <!-- flash outcome arrow -->
  <path d="M 438 576 C 438 618, 260 610, 160 590" stroke="#f472b6" stroke-width="1.8" fill="none" marker-end="url(#arrp)"/>
  <text x="252" y="618" fill="#f472b6" font-size="11.5">thingino boots — no vendor cloud, ever</text>

  <!-- footer note -->
  <text x="24" y="664" fill="#5c6b7a" font-size="11.5">camera-side TLS accepts the tool host's certs after the DNS redirect (CVE-2026-50720)</text>
</svg>
